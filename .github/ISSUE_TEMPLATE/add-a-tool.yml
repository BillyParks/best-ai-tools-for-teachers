name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Diffit"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://web.diffit.me"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Tools for Lesson Planning
        - AI Tools for Grading & Feedback
        - AI Tools for Quiz & Assessment Generation
        - AI Tools for Differentiated Instruction & Reading Levels
        - AI Tools for Parent Communication
        - AI Tools for Instructional Coaching & Professional Development
        - AI Tools for Classroom Engagement & Interactive Lessons
        - AI Tools for Content Creation (Slides, Worksheets & Video)
        - AI Tools for Plagiarism & AI-Writing Detection
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "Turns any text, topic, or video into leveled reading passages with vocabulary and comprehension questions."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
